<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spark">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Logo -->
  <g transform="translate(10, 10)">
    <!-- Outer ring with glow -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#purpleGradient)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner neural network structure -->
    <polygon points="20,6 34,12 34,28 20,34 6,28 6,12" fill="url(#purpleGradient)" opacity="0.2"/>
    
    <!-- Central core with pulse effect -->
    <circle cx="20" cy="20" r="8" fill="url(#purpleGradient)" filter="url(#glow)" opacity="0.8"/>
    <circle cx="20" cy="20" r="4" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- AI connection nodes -->
    <circle cx="12" cy="12" r="2" fill="#A855F7" filter="url(#spark)"/>
    <circle cx="28" cy="12" r="2" fill="#A855F7" filter="url(#spark)"/>
    <circle cx="32" cy="20" r="2" fill="#A855F7" filter="url(#spark)"/>
    <circle cx="28" cy="28" r="2" fill="#A855F7" filter="url(#spark)"/>
    <circle cx="12" cy="28" r="2" fill="#A855F7" filter="url(#spark)"/>
    <circle cx="8" cy="20" r="2" fill="#A855F7" filter="url(#spark)"/>
    
    <!-- Connection lines between nodes -->
    <line x1="12" y1="12" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="28" y1="12" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="32" y1="20" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="28" y1="28" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="28" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="8" y1="20" x2="20" y2="20" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <!-- Spark effects around the logo -->
  <g transform="translate(50, 10)">
    <circle cx="5" cy="8" r="1" fill="#C084FC" filter="url(#spark)" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="5" r="0.8" fill="#A855F7" filter="url(#spark)" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="25" r="1.2" fill="#8B5CF6" filter="url(#spark)" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
